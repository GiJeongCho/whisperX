[project]
name = "stt-server"
version = "0.1.0"
description = "WhisperX On-Premise API Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "whisperx" 
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly tell hatch where the source code is
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
whisperx = { path = "../whisperX", editable = true }

# Sync with whisperX pyproject.toml settings
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources.torch]
index = "pytorch"
marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'"

[tool.uv.sources.torchaudio]
index = "pytorch"
marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'"
