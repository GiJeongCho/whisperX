[project]
name = "stt-server"
version = "0.1.0"
description = "WhisperX On-Premise API Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    # "whisperx"  # Removed as we will install deps directly
    "ctranslate2>=4.5.0",
    "faster-whisper>=1.1.1",
    "nltk>=3.9.1",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pyannote-audio>=3.3.2,<4.0.0",
    "huggingface-hub<1.0.0",
    "transformers>=4.48.0",
    "triton>=3.3.0; sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly tell hatch where the source code is
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
# whisperx = { path = "./whisperx", editable = true } # We will rely on requirements.txt or direct inclusion

# Sync with whisperX pyproject.toml settings
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources.torch]
index = "pytorch"
marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'"

[tool.uv.sources.torchaudio]
index = "pytorch"
marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'"
